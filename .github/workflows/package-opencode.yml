name: Package OpenCode plugin

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/package-opencode.yml'
      - 'package.json'
      - 'bun.lock'
      - 'src/**'
      - 'examples/opencode/**'
      - 'docs/install.md'
      - 'scripts/check-syntax.mjs'
      - 'scripts/build-opencode-package.mjs'
      - 'scripts/generate-agent-markdown.mjs'
      - 'test/**'

permissions:
  contents: read

env:
  # The host version the native surfaces were pinned and verified on
  # (docs/opencode-install-and-config-plan.md, step 1 readiness report).
  OPENCODE_CLI_VERSION: '2.2.5'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install development dependencies
        run: bun install
      - name: Install the pinned OpenCode host
        run: npm install -g @opencode/cli@${OPENCODE_CLI_VERSION}
      - name: Check package boundaries and syntax
        run: |
          bun test
          bun run typecheck
          bun run test:pi-load
          bun run test:syntax test/integration/artifact.mjs test/integration/clean-install.mjs test/integration/opencode-native-surface.mjs test/integration/opencode-package-load.mjs test/integration/opencode-tool-visibility.mjs test/integration/opencode-delegate-display.mjs test/integration/opencode-stop-native.mjs
      - name: Test a clean OpenCode consumer install
        run: bun run test:clean-install
      - name: Pack installable plugins
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          bun run build:opencode-package
          npm pack ./dist/fusion-opencode --pack-destination dist
          cd dist
          sha256sum *.tgz > SHA256SUMS
      - name: Verify the native host surfaces (model-free)
        run: |
          bun run test:opencode-native
          bun run test:opencode-tool-visibility
      - name: Load the exact dedicated tarball through the package loader
        run: |
          FUSION_OPENCODE_TARBALL="$GITHUB_WORKSPACE/dist/fusion-opencode-$(node -p "require('./package.json').version").tgz" bun run test:opencode-package-load
          FUSION_OPENCODE_TARBALL="$GITHUB_WORKSPACE/dist/fusion-opencode-$(node -p "require('./package.json').version").tgz" bun run test:opencode-delegate-display
          FUSION_OPENCODE_TARBALL="$GITHUB_WORKSPACE/dist/fusion-opencode-$(node -p "require('./package.json').version").tgz" bun run test:opencode-stop-native
      - name: Upload plugin packages
        uses: actions/upload-artifact@v4
        with:
          name: fusion-opencode-${{ github.sha }}
          path: dist/
          if-no-files-found: error
      - name: Upload install test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-opencode-install-evidence-${{ github.sha }}
          path: artifacts/clean-install-*.json
          if-no-files-found: ignore
      - name: Upload native-surface and package-load evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-opencode-native-evidence-${{ github.sha }}
          path: |
            artifacts/opencode-native-surface-*.json
            artifacts/opencode-package-load-*.json
            artifacts/opencode-tool-visibility-*.json
            artifacts/opencode-delegate-display-*.json
            artifacts/opencode-stop-native-*.json
          if-no-files-found: ignore
