name: Package OpenCode plugin

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/package-opencode.yml'
      - 'package.json'
      - 'bun.lock'
      - 'src/**'
      - 'examples/opencode/**'
      - 'docs/install.md'
      - 'scripts/check-syntax.mjs'
      - 'test/package-isolation.test.ts'
      - 'test/integration/artifact.mjs'
      - 'test/integration/clean-install.mjs'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install development dependencies
        run: bun install
      - name: Check package boundaries and syntax
        run: |
          bun test test/package-isolation.test.ts
          bun run test:syntax test/integration/artifact.mjs test/integration/clean-install.mjs
      - name: Test a clean OpenCode consumer install
        run: bun run test:clean-install
      - name: Pack installable plugin
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          cd dist
          sha256sum *.tgz > SHA256SUMS
      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: fusion-opencode-${{ github.sha }}
          path: dist/
          if-no-files-found: error
      - name: Upload install test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-opencode-install-evidence-${{ github.sha }}
          path: artifacts/clean-install-*.json
          if-no-files-found: ignore
